[project]
name = "farm-agent"
version = "0.1.0"
description = "Agentic farm planning system: LLM-reasoning agents with tool access, orchestrated via a conditionally-branching LangGraph state machine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]
